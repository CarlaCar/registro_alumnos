<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Instituto Universitario Ch - Inicio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <header>
    <a href="index.html" class="logo-link">
      <img src="img/logo.png.png" alt="Logo Instituto Universitario Ch" class="logo-img">
      <h1 class="titulo-principal">Instituto Universitario Ch</h1>
    </a>
    <nav class="nav-central">
      <a href="index.html">Inicio</a>
      <a href="carreras.html">Carreras</a>
      <a href="categorias.html">Categorías</a>
    </nav>
  </header>
  <main>
    <section class="card card-bienvenida">
      <h2>Bienvenido al Sistema de Registro de Alumnos</h2>
      <p>
        Gestioná de manera simple.<br>
        <span class="span-azul"></span>
      </p>
    </section>

    <section class="card">
      <h2>Registro de Alumnos</h2>
      <form id="formAlumno" class="form-columna">
        <label for="registerName">Nombre:</label>
        <input type="text" id="registerName" required placeholder="Ej: Carla" class="campo-uniforme" />

        <label for="registerCareer">Carrera:</label>
        <select id="registerCareer" class="campo-uniforme" required>
          <!-- Opciones -->
        </select>

        <button type="button" class="btn-uniforme" onclick="registerStudent()">Agregar</button>
      </form>
    </section>

    <!-- Buscar Alumno -->
    <section class="card">
      <h2>Buscar Alumno</h2>
      <div class="form-columna">
        <input type="text" id="studentSearch" placeholder="Nombre o ID del alumno" class="campo-uniforme" />
        <button class="btn-uniforme" onclick="searchStudent()">Buscar</button>
      </div>
      <div id="studentSearchResult" class="result"></div>
    </section>

    <!-- Eliminar Alumno -->
    <section class="card">
      <h2>Eliminar Alumno</h2>
      <input type="number" id="studentDelete" class="form-control campo-uniforme" placeholder="ID del alumno" />
      <button class="btn btn-celeste campo-uniforme" onclick="deleteStudent()">Eliminar</button>
      <div id="studentDeleteResult" class="result"></div>
    </section>

    <!-- Tabla de alumnos cargados -->
    <section id="dataSummary" class="card">
      <h3>Alumnos cargados</h3>
      <table class="table" id="studentsTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Carrera</th>
          </tr>
        </thead>
        <tbody>
          <!-- Las filas se llenan desde JS -->
        </tbody>
      </table>
    </section>
  </main>
  <footer class="footer-principal">
    &copy; 2025 Instituto Universitario Ch. 
  </footer>

  <div id="customAlert" class="custom-alert"></div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="app.js"></script>
</body>
</html>
